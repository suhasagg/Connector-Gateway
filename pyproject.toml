[project]
name = "connector-gateway"
version = "1.0.0"
description = "Production-oriented gateway for MCP, REST, GraphQL, and CLI connectors"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "redis>=5,<6",
  "sqlalchemy>=2.0,<3",
  "asyncpg>=0.29,<1",
  "prometheus-client>=0.20,<1",
  "PyJWT>=2.9,<3",
  "cryptography>=43,<45",
  "structlog>=24,<26",
  "tenacity>=9,<10",
  "jsonschema>=4.23,<5",
  "strawberry-graphql>=0.240,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
